# Fase M1 — Config de Supabase CLI.
#
# project_id: reemplaza con el project-ref real antes de `supabase link`.
# (Si ya usas este proyecto para RanchoApp2-DB, es el mismo project-ref —
# el esquema `facturapp` convive en el mismo proyecto, separado por schema.)
project_id = "smocemszqzsypuachevr"

[api]
enabled = true
port = 54321
# `facturapp` debe listarse aquí para que PostgREST/supabase-js puedan
# consultarlo con `.schema("facturapp")` — por defecto solo expone `public`.
schemas = ["public", "facturapp", "graphql_public"]
extra_search_path = ["public", "facturapp"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# verify_jwt = false es OBLIGATORIO en estas dos funciones: SendGrid y Meta
# llaman al webhook sin un JWT de Supabase (no pueden generarlo). Sin esto,
# el gateway de Supabase rechazaría toda petición externa con 401 antes de
# que el código de la función siquiera se ejecute.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.sendgrid-webhook]
verify_jwt = false

# api-chat SÍ requiere autenticación real — pero verify_jwt = false también
# es obligatorio aquí, por una razón distinta: nuestros usuarios tienen un
# JWT propio emitido por el backend Python (HS256, SECRET_KEY compartido),
# NO un JWT de Supabase Auth (nuestros usuarios no pasan por Supabase Auth
# en absoluto). Si se dejara verify_jwt = true, el gateway de Supabase
# rechazaría con 401 CUALQUIER request — incluso con un access token válido
# — porque no es un JWT que Supabase Auth reconozca. La verificación real
# ocurre dentro de la función (_shared/auth.ts, mismo SECRET_KEY que Python).
[functions.api-chat]
verify_jwt = false

# Fase M7 -- mismo razonamiento que api-chat: JWT propio (HS256,
# SECRET_KEY compartido con Python), no JWT de Supabase Auth.
[functions.auth-register]
verify_jwt = false

[functions.auth-login]
verify_jwt = false

[functions.auth-refresh]
verify_jwt = false

[functions.api-user-profile]
verify_jwt = false

[functions.api-summary]
verify_jwt = false

[functions.api-invoices]
verify_jwt = false

# api-public-* no usan NINGÚN JWT -- se autentican por `web_token` en query
# param (ver _shared/users.ts: getUserByWebToken). Mismo motivo que los
# webhooks: sin esto, el gateway de Supabase exigiría un JWT de Supabase
# Auth antes de que el código de la función corra.
[functions.api-public-summary]
verify_jwt = false

[functions.api-public-invoices]
verify_jwt = false

# dashboard sirve HTML público (la pantalla de login incluida), así que no
# puede exigir un JWT para entregarse. La autenticación ocurre después, en
# las llamadas que la página hace a la API.
[functions.dashboard]
verify_jwt = false
